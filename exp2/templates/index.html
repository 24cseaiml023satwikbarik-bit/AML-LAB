<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Mark Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Student Mark Predictor</h1>
        <p class="subtitle">Using Multiple Linear Regression</p>
        
        <form method="POST" action="/">
            <div class="form-group">
                <label for="attendance">Attendance (%):</label>
                <input type="number" id="attendance" name="attendance" min="0" max="100" step="0.1" required placeholder="e.g. 85">
            </div>

            <div class="form-group">
                <label for="study_hours">Study Hours:</label>
                <input type="number" id="study_hours" name="study_hours" min="0" step="0.1" required placeholder="e.g. 6">
            </div>
            
            <div class="form-group">
                <label for="assignment_marks">Assignment Marks:</label>
                <input type="number" id="assignment_marks" name="assignment_marks" min="0" step="0.1" required placeholder="e.g. 18">
            </div>

            <div class="button-group">
                <button type="submit" name="submit" class="btn btn-primary">Predict Marks</button>
                <button type="submit" name="visualize" class="btn btn-secondary">Predict & Visualize</button>
                <a href="/" class="btn btn-danger">Reset</a>
            </div>
        </form>

        {% if prediction %}
        <div class="result-box">
            <h2>Predicted Final Mark: <span class="highlight">{{ prediction }}</span></h2>
            
            <div class="equation-box">
                <strong>Regression Equation:</strong><br>
                <code>{{ equation }}</code>
            </div>

            {% if plot_url %}
            <div class="graph-box">
                <h3>Model Analytics</h3>
                <img src="data:image/png;base64,{{ plot_url }}" alt="Analytics Graphics">
            </div>
            {% endif %}
        </div>
        {% endif %}
    </div>
</body>
</html>
